name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prolog-and-clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog and CLIPS
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox clips
      - name: Prolog programs
        run: bash tests/prolog.sh
      - name: CLIPS programs
        run: bash tests/clips.sh

  semantic-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B verify